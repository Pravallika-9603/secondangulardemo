<div class="container-fluid">
    <h6 class="heading">CreateAtm</h6>

    <div class="form-group">
        <label for="cardNumber">cardNumber</label>
        <input class="form-control" type="text" 
        name="cardNo" [(ngModel)]="atm.cardno" />
    </div>
    
    <div class="form-group">
        <label for="Pin">Pin Number</label>
        <input class="form-control" type="text" 
        name="Pin Number" [(ngModel)]="atm.pin" />
    </div>
     
    <div class="form-group">
        <label for="cvv">cvv</label>
        <input class="form-control" type="text" 
        name="cvv" [(ngModel)]="atm.cvv"/>
    </div>
    
    <div class="form-group">
        <label for="Expiry">Expiry</label>
        <input class="form-control" type="date" 
        name="Expiry" [(ngModel)]="atm.expiry"/>
    </div>

    <div class="form-group">
        <label for="AccountNumber">Account Number</label>
        <input class="form-control" type="text"      
        name="Account Number" [(ngModel)]="atm.accountNumber" />
    </div>
    
    <button type="submit" class="btn btn-primary" (click)="createAtm()">Create Atm</button>
</div>
