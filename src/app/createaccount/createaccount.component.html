<div class="container-fluid">
    <h6 class="heading">CreateAccount {{accountNumber}}</h6>
    <div class="form-group">
        <label for="name">Name</label>
        <input class="form-control" type="text" 
        name="name" [(ngModel)]="account.name"/>
    </div>
    
    <div class="form-group">
        <label for="pan">Pan Number</label>
        <input class="form-control" type="text" 
        name="pan" [(ngModel)]="account.pan"/>
    </div>
    
    <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input class="form-control" type="text" 
        name="mobileNumber" [(ngModel)]="account.mobileNumber"/>
    </div>
    
    <div class="form-group">
        <label for="balance">Balance</label>
        <input class="form-control" type="text" 
        name="balance" [(ngModel)]="account.balance"/>
    </div>
    /*
    #custaddress----template reference variable
    */
    <app-address #custaddress></app-address>
    <button type="submit" class="btn btn-primary" (click)="createAccount(custaddress)">Create Account</button>
</div>
